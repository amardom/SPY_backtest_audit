[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "SPY_backtest_audit"
version = "0.1.0"
description = "Reproducible investigation of short-term equity mean reversion"
requires-python = ">=3.11"
dependencies = ["reportlab==5.0.1", "matplotlib==3.11.2", "pypdf==6.21.1", "numpy==2.5.4"]

[tool.setuptools.packages.find]
include = ["spy_backtest_audit*"]
